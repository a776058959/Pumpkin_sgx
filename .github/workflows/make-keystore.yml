name: Generate APK signing keystore (one-off)

# 一次性工具：生成固定的 APK 签名密钥并作为 artifact 上传。
# 下载后提交到仓库 android-app/pumpkin-signing.p12，
# 这样每次构建的 APK 签名一致，安装新版可以直接覆盖，不用卸载、不丢世界数据。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate PKCS12 keystore
        run: |
          keytool -genkeypair -v \
            -keystore pumpkin-signing.p12 \
            -storetype PKCS12 \
            -alias pumpkin \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass pumpkin123 -keypass pumpkin123 \
            -dname "CN=Pumpkin Server, OU=Self-signed, O=Pumpkin, L=NA, ST=NA, C=CN"
          keytool -list -v -keystore pumpkin-signing.p12 -storepass pumpkin123 | head -20
          ls -l pumpkin-signing.p12

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: apk-signing-keystore
          path: pumpkin-signing.p12
